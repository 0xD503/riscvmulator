[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/0xD503/riscvmulator.git"
license = "MIT OR Apache-2.0"
keywords = [ "emulator", "risc-v", "riscv", "cpu", "firmware" ]
categories = [ "emulators" ]
rust-version = "1.100"

[workspace.dependencies]
riscv = { version = "0.16.1" }
riscv-rt = { version = "0.18.0" }

[workspace.lints.rust]
unsafe_code = "allow"
unnameable_types = "deny"
private_interfaces = "deny"

[package]
name = "riscvmulator-simple_firmware"
description = "A simple firmware for RISC-V CPU. Runs in machine mode, used for basic bootstrap/debugging"
readme = "README.md"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# riscv.workspace = true
# riscv-rt.workspace = true

[lints]
workspace = true


# ## profile settings

