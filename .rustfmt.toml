edition = "2024"
style_edition = "2024"

max_width = 80                  ## max line width
#comment_width = 80
#wrap_comments = true

hard_tabs = false               ## use spaces instead of tabs
tab_spaces = 4                  ## indent width

newline_style = "Unix"          ## Line endings: "Unix" (LF) or "Windows" (CRLF)

#imports_granularity = "Module"
### separate std, external crates, and local modules with blank lines between groups
#group_imports = "StdExternalCrate"

## Trailing commas and semicolons
# trailing_comma = "Vertical"

## Braces
# brace_style = "SameLineWhere"
