[package]
name = "riscvmulator"
version = "0.1.0"
edition = "2024"
description = "RISC-V emulator"
readme = "README.md"
repository = "https://github.com/0xD503/riscvmulator.git"
license = "MIT OR Apache-2.0"
keywords = [ "emulator", "risc-v", "riscv", "cpu" ]
categories = [ "emulators" ]
## use fixed `major`/`minor`, but latest `patch` version
rust-version = "1.95"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
log = { version = "0.4.29", features = [ "max_level_trace", "release_max_level_trace" ] }
env_logger = "0.11.10"
clap = { version = "4.6.0", features = ["derive"] }
elf = { version = "0.8.0" }
#num-traits = { version = "0.2.19" }
#bitfield = "0.19.4"

# [toolchain]
# ## use fixed `major`/`minor`, but latest `patch` version
# #channel = "1.999"
