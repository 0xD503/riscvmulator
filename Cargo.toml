[workspace]
members = ["crates/riscvmulator-soc", "crates/riscvmulator-emulator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/0xD503/riscvmulator.git"
license = "MIT OR Apache-2.0"
keywords = [ "emulator", "risc-v", "riscv", "cpu" ]
categories = [ "emulators" ]
rust-version = "1.98"  ## use fixed `major`/`minor`, but latest `patch` version

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
log = { version = "0.4.29", features = [ "max_level_trace", "release_max_level_info" ] }
env_logger = "0.11.10"
clap = { version = "4.6.0", features = ["derive"] }
elf = { version = "0.8.0" }
figment = { version = "0.10.19", features = ["toml", "env"] }
ctrlc = { version = "3.5.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
unnameable_types = "deny"
private_interfaces = "deny"

[package]
name = "riscvmulator"
description = "RISC-V emulator binary"
readme = "README.md"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
riscvmulator-emulator = { path = "crates/riscvmulator-emulator" }
log = { workspace = true }
ctrlc = { workspace = true }

[lints]
workspace = true


## profile settings

[profile.dev]
split-debuginfo = "unpacked"   # decreases link-time

[profile.release]
opt-level = 3
panic = "unwind"
#strip = "symbols"  # don't strip before PLO/PGO
## LTO
lto = "fat"
codegen-units = 1

## same as release, but adds debinfo
[profile.release-with-debinfo]
inherits = "release"
debug = "full"
split-debuginfo = "unpacked"   # decreases link-time
strip = "none"

## same as release-with-debinfo, but with additional checks
[profile.release-checked]
inherits = "release-with-debinfo"
debug-assertions = true
overflow-checks = true

## optimized for binary size
[profile.release-size]
inherits = "release"
opt-level = "z"
strip = "symbols"
panic = "abort"
