## all container services (containers)
services:
  ## release container
  emulator:
    ## build instructions
    build:
      ## use `COntainerfile` withing current dir
      context: .
      ## container file name within context
      dockerfile: Containerfile
      ## stop build at `${RELEASE_CONTAINER_NAME}` stage
      target: ${RELEASE_CONTAINER_NAME}
      args:
        WD: ${WD}
        USER_SHELL: ${USER_SHELL}
        APP_NAME: ${APP_NAME}
        RELEASE_LOG_LEVEL: ${RELEASE_LOG_LEVEL}
    environment:
      - RVMULATOR_EMULATOR__LOGGING__LEVEL=${RELEASE_LOG_LEVEL}
    volumes:
      ## local compiled tests into container as read-only partition
      - ./3rd_party/riscv-tests/isa:${WD}/riscv-tests:ro

  ## development container: Rust + RISC-V toolchain, source mounted live
  ## Usage:
  ##   ${CONTAINER_ENGINE} run --rm dev              # interactive shell
  ##   ${CONTAINER_ENGINE} run --rm dev cargo build  # single-shot command
  dev:
    image: ${DEV_SERVICE_STARTING_IMAGE_NAME}:local
    build:
      context: .
      ## container file name within context
      dockerfile: Containerfile
      target: ${DEV_CONTAINER_NAME}
      args:
        WD: ${WD}
    ## set work dir when enter container
    working_dir: ${WD}
    volumes:
      ## mount project root to `${WD}` directory within container
      - .:${WD}
      ## keep cargo cache between container runs to avoid redownload/recompile
      - cargo-cache:/usr/local/cargo/registry
      ## keep installed cargo binaries between container runs
      - cargo-bin:/usr/local/cargo/bin
    environment:
      - RVMULATOR_EMULATOR__LOGGING__LEVEL=${DEBUG_LOG_LEVEL}
    ## keep container for interactive use (i.e. add `-it` to args automatically)
    ## enable input (so you can type into the container, i.e., add `-i` arg)
    stdin_open: true
    ## allocate terminal (i.e., add `-t` arg)
    tty: true
    ## command to run on container run: interactive shell
    command: ${USER_SHELL}
    ## map host identity to container user so bind-mount files stay user's
    userns_mode: "${DEV_USERNS_MODE:-keep-id}"
    ## facilitate debuggers usage
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE

## declare named volumes to keep them between container runs
volumes:
  cargo-cache:
  cargo-bin:
