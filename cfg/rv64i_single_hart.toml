[emulator]
log_level = "info"
## 0 means as fast as possible
frequency_hz = 0

[soc]
harts_num = 1
xtal_frequency_hz = 16384

[soc.hart]
pc_reset_value = 0x8000_0000

extension_I = true
extension_M = false
extension_A = false
extension_F = false
extension_D = false
extension_C = false
extension_Zifencei = false
extension_Zicsr = false

[soc.bus]

[soc.bus.memory]
base_addr = 0x8000_0000
size_bytes = 262144    ## 256 KB

[soc.bus.peripherals]
